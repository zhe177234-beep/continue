<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智学 · 学习知识库</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><span class="mark">知</span><div><h1>智学知识系统</h1><p>让每一次学习，都有据可查</p></div><span class="badge">离线检索基线 v0.1</span></header>
<main><aside><h2>我的资料</h2><p class="hint">上传 UTF-8 文本、Markdown 或文本型 PDF，单文件不超过 3 MiB。</p><label>访问令牌（仅配置后需要）<input id="token" type="password" autocomplete="off" placeholder="APP_TOKEN"></label><button id="connect">刷新连接</button><label class="upload">选择学习资料<input id="file" type="file" accept=".txt,.md,.pdf"></label><button id="upload">上传并建立索引</button><ul id="documents"></ul><h2>知识关系</h2><p class="hint">从资料中的“关系：实体|关系|实体”读取，可追溯到原文。</p><ul id="graph"></ul></aside>
<section><div class="intro"><span class="eyebrow">LEARNING WORKSPACE</span><h2>从资料出发，理解知识</h2><p>输入问题，查看相关原文和出处。当前使用证据摘录，不调用大模型。</p></div><form id="ask"><label for="question">你想了解什么？</label><textarea id="question" maxlength="1000" required placeholder="例如：梯度下降和学习率有什么关系？"></textarea><div class="toolbar"><select id="mode" aria-label="检索模式"><option value="auto">自动路由</option><option value="hybrid">混合检索</option><option value="bm25">BM25 关键词</option><option value="cosine">词频余弦</option><option value="graph">知识关系增强</option></select><button id="submit">检索资料</button></div></form><p id="status" role="status" aria-live="polite"></p><article id="answer"></article><div id="sources"></div></section></main><footer>本地单用户演示 · 答案以原始资料为依据 · 算法对照实验可独立运行</footer></body></html>
