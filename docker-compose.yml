services:
  knowledge:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/knowledge.db"
      APP_TOKEN: "${APP_TOKEN:?Set APP_TOKEN with at least 16 characters}"
    volumes:
      - knowledge-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Authorization':'Bearer '+os.environ['APP_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  knowledge-data:
