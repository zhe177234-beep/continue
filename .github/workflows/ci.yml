name: Verify learning system
on:
  push:
    branches: [main, feat/learning-rag-baseline]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python ai-service/evaluate.py
      - run: mvn -B -f server/pom.xml package
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: web/test-results
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: cp .env.example .env && docker compose config --quiet && docker compose up --build -d
      - run: python scripts/smoke.py
      - run: docker compose logs --no-color
        if: always()
      - run: docker compose down -v
        if: always()
